services:
  postgres:
    image: postgres:16-alpine
    container_name: earth_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: earth
      POSTGRES_USER: earth
      POSTGRES_PASSWORD: earth_dev_only
    ports:
      - "5432:5432"
    volumes:
      - earth_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U earth -d earth"]
      interval: 2s
      timeout: 5s
      retries: 10

volumes:
  earth_postgres_data:

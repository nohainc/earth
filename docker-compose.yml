services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: earth
      POSTGRES_USER: earth
      POSTGRES_PASSWORD: earth_dev_only
    ports:
      - "5432:5432"
    volumes:
      - earth_postgres_data:/var/lib/postgresql/data
      - ./db/migrations/001_initial.sql:/docker-entrypoint-initdb.d/001_initial.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/002_seed.sql:ro
volumes:
  earth_postgres_data:

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Corporate Theme Gradients -->
    <linearGradient id="nexusGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082" stop-opacity="1" />
      <stop offset="50%" stop-color="#FFB300" stop-opacity="1" />
      <stop offset="100%" stop-color="#FF6F00" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="nexusCyan" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="1" />
      <stop offset="60%" stop-color="#00B0FF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#7C4DFF" stop-opacity="0.8" />
    </linearGradient>

    <radialGradient id="planetCore" cx="38%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.95" />
      <stop offset="40%" stop-color="#0288D1" stop-opacity="0.9" />
      <stop offset="80%" stop-color="#0A192F" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#030812" stop-opacity="1" />
    </radialGradient>

    <radialGradient id="ambientGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.30" />
      <stop offset="65%" stop-color="#FFB300" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <filter id="luminousGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 1. Ambient Background Glow -->
  <circle cx="256" cy="256" r="230" fill="url(#ambientGlow)" />

  <!-- 2. The 4 United Corporate Quadrant Chevrons (Framing the World) -->
  <g filter="url(#luminousGlow)" stroke-linejoin="round" stroke-linecap="round">
    <!-- North Chevron (Governance / Apex) -->
    <path d="M 256,26 L 360,130 L 330,130 L 256,56 L 182,130 L 152,130 Z" 
          fill="url(#nexusGold)" 
          stroke="url(#nexusGold)" 
          stroke-width="2" />

    <!-- South Chevron (Industry / Infrastructure) -->
    <path d="M 256,486 L 360,382 L 330,382 L 256,456 L 182,382 L 152,382 Z" 
          fill="url(#nexusGold)" 
          stroke="url(#nexusGold)" 
          stroke-width="2" />

    <!-- East Chevron (Finance / Markets) -->
    <path d="M 486,256 L 382,152 L 382,182 L 456,256 L 382,330 L 382,360 Z" 
          fill="url(#nexusCyan)" 
          stroke="url(#nexusCyan)" 
          stroke-width="2" />

    <!-- West Chevron (Energy / Technology) -->
    <path d="M 26,256 L 130,152 L 130,182 L 56,256 L 130,330 L 130,360 Z" 
          fill="url(#nexusCyan)" 
          stroke="url(#nexusCyan)" 
          stroke-width="2" />
  </g>

  <!-- 3. Inner Concentric Alliance Perimeter & Cardinal Ties -->
  <g stroke="url(#nexusGold)" stroke-width="1.8" opacity="0.65">
    <!-- Outer Connecting Inset Lines -->
    <line x1="256" y1="56" x2="456" y2="256" />
    <line x1="456" y1="256" x2="256" y2="456" />
    <line x1="256" y1="456" x2="56" y2="256" />
    <line x1="56" y1="256" x2="256" y2="56" />

    <!-- 4 Cardinal Docking Nodes -->
    <circle cx="256" cy="76" r="4.5" fill="url(#nexusGold)" />
    <circle cx="436" cy="256" r="4.5" fill="url(#nexusCyan)" />
    <circle cx="256" cy="436" r="4.5" fill="url(#nexusGold)" />
    <circle cx="76" cy="256" r="4.5" fill="url(#nexusCyan)" />
  </g>

  <!-- 4. Central Planetary Sphere (Earth with Continental Trade Network) -->
  <g id="planetSphere">
    <!-- Base Globe -->
    <circle cx="256" cy="256" r="148" fill="url(#planetCore)" />

    <!-- Luminous Atmosphere Rim -->
    <circle cx="256" cy="256" r="148" 
            fill="none" 
            stroke="url(#nexusCyan)" 
            stroke-width="4.5" 
            filter="url(#luminousGlow)" />

    <!-- Globe Surface Elements (Clipped inside Globe) -->
    <g clip-path="url(#globeClip)">
      <clipPath id="globeClip">
        <circle cx="256" cy="256" r="146" />
      </clipPath>

      <!-- Latitude Parallels -->
      <ellipse cx="256" cy="196" rx="136" ry="34" fill="none" stroke="#FFFFFF" stroke-width="1.4" opacity="0.30" />
      <ellipse cx="256" cy="256" rx="146" ry="42" fill="none" stroke="#FFFFFF" stroke-width="1.8" opacity="0.45" />
      <ellipse cx="256" cy="316" rx="136" ry="34" fill="none" stroke="#FFFFFF" stroke-width="1.4" opacity="0.30" />

      <!-- Longitude Meridians -->
      <ellipse cx="256" cy="256" rx="52" ry="146" fill="none" stroke="#FFFFFF" stroke-width="1.6" opacity="0.38" />
      <ellipse cx="256" cy="256" rx="104" ry="146" fill="none" stroke="#FFFFFF" stroke-width="1.6" opacity="0.38" />
    </g>
  </g>
</svg>

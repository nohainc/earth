<!DOCTYPE html>
<html lang="en">
<head>
  <base href="/">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="EARTH — a shared world for human coordination.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EARTH — United Corporations</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0b0f19;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    #earth-loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 32px;
      text-align: center;
    }
    .earth-brand {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 4px;
      color: #f8fafc;
    }
    .earth-subhead {
      font-size: 12px;
      letter-spacing: 2px;
      color: #94a3b8;
      text-transform: uppercase;
    }
    .earth-spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(148, 163, 184, 0.2);
      border-top-color: #7163e8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 8px 0;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .earth-status-text {
      font-size: 13px;
      color: #64748b;
      font-family: monospace;
    }
    .earth-fallback-error {
      display: none;
      margin-top: 16px;
      padding: 16px;
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: 8px;
      max-width: 400px;
    }
    .earth-reload-btn {
      margin-top: 12px;
      padding: 8px 16px;
      background: #7163e8;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="earth-loading-container">
    <div class="earth-brand">EARTH</div>
    <div class="earth-subhead">United Corporations &bull; Command Center</div>
    <div class="earth-spinner" id="earth-spinner"></div>
    <div class="earth-status-text" id="earth-status">INITIALIZING SYSTEM ARCHITECTURE...</div>
    <div class="earth-fallback-error" id="earth-error">
      <p>Bootstrap initialization timed out or encountered an asset delivery error.</p>
      <button class="earth-reload-btn" onclick="window.location.reload()">Reload Application</button>
    </div>
  </div>

  <script>
    // Fallback timer: if flutter doesn't mount in 8 seconds, reveal fallback error
    const timer = setTimeout(() => {
      const err = document.getElementById('earth-error');
      const spinner = document.getElementById('earth-spinner');
      if (err) err.style.display = 'block';
      if (spinner) spinner.style.display = 'none';
    }, 8000);

    window.addEventListener('flutter-first-frame', () => {
      clearTimeout(timer);
      const loader = document.getElementById('earth-loading-container');
      if (loader) loader.style.display = 'none';
    });
  </script>
  <script src="flutter_bootstrap.js?v=2026-08-15-auth-recovery-1" async></script>
</body>
</html>

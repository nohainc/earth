name: EARTH tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: earth-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: earth
          POSTGRES_USER: earth
          POSTGRES_PASSWORD: earth_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U earth -d earth"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Apply PostgreSQL schema and seed
        env:
          DATABASE_URL: postgres://earth:earth_ci@localhost:5432/earth
        run: |
          npm run db:migrate:postgres
          PGPASSWORD=earth_ci psql -h localhost -U earth -d earth -f db/seed.sql
          npm run db:verify:manifest
          npm run db:verify:invariants
      - run: npm run check
      - run: npm run cf:assert-postgres
      - run: npm test
        env:
          DATABASE_URL: postgres://earth:earth_ci@localhost:5432/earth

  flutter:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_client
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --release --dart-define=EARTH_API_URL=https://earthuc.com
      - name: Check deployed PostgreSQL Worker
        run: curl --fail --silent --show-error https://earthuc.com/api/health

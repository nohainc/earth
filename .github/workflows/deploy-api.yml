name: Deploy EARTH API

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: earth-api-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run cf:assert-postgres
      - run: npm run audit:mutation-boundaries
      - run: npx wrangler deploy --dry-run --config wrangler.api.jsonc
      - name: Deploy API Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.api.jsonc
      - name: Verify API health
        continue-on-error: true
        env:
          DEPLOY_URL: ${{ vars.DEPLOY_URL || 'https://earthuc.com' }}
        run: |
          node -e "
            const url = process.env.DEPLOY_URL + '/api/health';
            fetch(url)
              .then(async (r) => {
                if (!r.ok) throw Error('health returned ' + r.status + ' from ' + url);
                const b = await r.json();
                if (!b.ok) throw Error('API is not healthy');
                console.log('API healthy:', url);
              })
              .catch((err) => {
                if (err.cause?.code === 'ENOTFOUND' || err.message?.includes('ENOTFOUND') || err.message?.includes('fetch failed')) {
                  console.warn('Live verification skipped: Domain DNS is not yet propagated (' + err.message + ')');
                  return;
                }
                throw err;
              });
          "


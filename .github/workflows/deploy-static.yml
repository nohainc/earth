name: Deploy EARTH landing and static files

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: earth-static-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run static:prepare
      - run: npx wrangler deploy --dry-run --config wrangler.static.jsonc
      - name: Deploy landing/static Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.static.jsonc
      - name: Verify landing route
        continue-on-error: true
        env:
          DEPLOY_URL: ${{ vars.DEPLOY_URL || 'https://earthuc.com' }}
        run: |
          node -e "
            const url = process.env.DEPLOY_URL + '/';
            fetch(url)
              .then(async (r) => {
                if (!r.ok) throw Error('landing returned ' + r.status);
                const b = await r.text();
                if (!b.includes('EARTH')) throw Error('landing content missing');
                console.log('Landing route:', r.status);
              })
              .catch((err) => {
                if (err.cause?.code === 'ENOTFOUND' || err.message?.includes('ENOTFOUND') || err.message?.includes('fetch failed')) {
                  console.warn('Live verification skipped: Domain DNS is not yet propagated (' + err.message + ')');
                  return;
                }
                throw err;
              });
          "


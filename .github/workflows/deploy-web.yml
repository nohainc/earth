name: Deploy EARTH Flutter web app

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: earth-app-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: flutter_client
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
        working-directory: .
      - run: flutter pub get
      - run: flutter analyze --no-fatal-warnings --no-fatal-infos
      - run: flutter test
      - run: flutter build web --release --base-href=/app/ --dart-define=EARTH_API_URL=https://earthuc.com
      - run: node scripts/prepare-flutter-assets.mjs
        working-directory: .
      - name: Deploy Flutter app Worker
        working-directory: .
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.app.jsonc
      - name: Verify app route
        working-directory: .
        continue-on-error: true
        env:
          DEPLOY_URL: ${{ vars.DEPLOY_URL || 'https://earthuc.com' }}
        run: |
          node -e "
            const url = process.env.DEPLOY_URL + '/app';
            fetch(url)
              .then(async (r) => {
                if (!r.ok) throw Error('app returned ' + r.status + ' from ' + url);
                console.log('Flutter app route:', r.status, r.headers.get('content-type'));
              })
              .catch((err) => {
                if (err.cause?.code === 'ENOTFOUND' || err.message?.includes('ENOTFOUND') || err.message?.includes('fetch failed')) {
                  console.warn('Live verification skipped: Domain DNS is not yet propagated (' + err.message + ')');
                  return;
                }
                throw err;
              });
          "
